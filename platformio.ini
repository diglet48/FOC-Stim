; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base]
monitor_speed = 115200

build_flags =
	-DHAL_OPAMP_MODULE_ENABLED
	-D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
	-DHAL_TIM_MODULE_ONLY
	-D SERIAL_RX_BUFFER_SIZE=512
	-D SERIAL_TX_BUFFER_SIZE=512

custom_nanopb_protos =
    +<proto/focstim/focstim_rpc.proto>
    +<proto/focstim/messages.proto>
    +<proto/focstim/notifications.proto>
    +<proto/focstim/constants.proto>
custom_nanopb_options =
    --error-on-unmatched

extra_scripts = post:build_hex.py


[env:disco_b_g431b_esc1] ; for V1
extends = base
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
lib_deps =
	nanopb/Nanopb@^0.4.91
build_flags =
	${base.build_flags}
    -ggdb3 -g3


[focstim_v4_base] ; for V4.x
extends = base
platform = ststm32
board = focstim_v4
framework = arduino
lib_deps =
	nanopb/Nanopb@^0.4.91
	adafruit/Adafruit SSD1306 @ ^2.5.15
    adafruit/Adafruit GFX Library @ ^1.12.1
	https://github.com/stm32duino/LSM6DSOX

build_flags =
	${base.build_flags}
    -Os -ggdb3 -g3 ; -flto

[env:focstim_v4]
extends = focstim_v4_base
build_flags =
	${focstim_v4_base.build_flags}
	-D TRANSFORMER_42TL004

[env:focstim_v4_42tl001]
extends = focstim_v4_base
build_flags =
	${focstim_v4_base.build_flags}
	-D TRANSFORMER_42TL001

[env:native_tests]
extends = base
platform = native
test_ignore = test_embedded
test_build_src = true
build_src_filter = "+<signals/threephase_math.cpp> +<signals/fourphase_math.cpp> +<mat.cpp> +<foc_utils.cpp> +<utils.cpp> +<complex.cpp>"
debug_test = *
build_flags = -DUNITY_INCLUDE_PRINT_FORMATTED
debug_build_flags = -O0 -ggdb3 -g3 -DUNITY_INCLUDE_PRINT_FORMATTED
